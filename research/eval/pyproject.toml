[project]
name = "iris-eval"
version = "0.1.0"
description = "Project IRIS evaluation harness: scoring, splits and baseline readers (research only)"
license = "Apache-2.0"
requires-python = ">=3.11"
# Licences checked for O4: rapidfuzz MIT, apted MIT, Pillow MIT-CMU.
dependencies = [
    "rapidfuzz==3.14.6",
    "apted==1.0.3",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
# pytest MIT, ruff MIT, mypy MIT
dev = ["pytest==9.1.1", "ruff==0.17.5", "mypy==2.3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["iris_eval", "conftest"]

[tool.mypy]
strict = true
packages = ["iris_eval"]

[[tool.mypy.overrides]]
module = ["apted", "apted.*"]
ignore_missing_imports = true
